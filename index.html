<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Brain Gym and forest garden claude proooo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow training log. Seven game colours (g1-g7) carry the colour; the cobalt Today block anchors the home screen. */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --ink:#101A33; --muted:#59657F; --line:#D3DAE8; --soft:#E3E9FF;
  --accent:#2748F0; --accent-ink:#FFFFFF; --gold:#F2B01E; --good:#18915A; --bad:#D4323B;
  --c-red:#D4323B; --c-blue:#2748F0; --c-green:#18915A; --c-yellow:#C98F00;
  --g1:#D9452D; --g2:#6F3FF5; --g3:#0B8A86; --g4:#E39A00; --g5:#D12A82; --g6:#23893F; --g7:#2F6BFF;
  --g1i:#FFFFFF; --g2i:#FFFFFF; --g3i:#FFFFFF; --g4i:#1B1400; --g5i:#FFFFFF; --g6i:#FFFFFF; --g7i:#FFFFFF;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1223; --surface:#151D33; --ink:#E9EEFB; --muted:#9AA6C4; --line:#26304D; --soft:#202B4D;
    --accent:#7C93FF; --accent-ink:#0C1223; --gold:#F5C04A; --good:#3DD68C; --bad:#FF6B73;
    --c-red:#FF6B73; --c-blue:#7C9BFF; --c-green:#3DD68C; --c-yellow:#F5C04A;
    --g1:#FF7A63; --g2:#A58BFF; --g3:#3FD6CF; --g4:#FFC24A; --g5:#FF72B8; --g6:#5BE08A; --g7:#78A0FF;
    --g1i:#0C1223; --g2i:#0C1223; --g3i:#0C1223; --g4i:#0C1223; --g5i:#0C1223; --g6i:#0C1223; --g7i:#0C1223;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1223; --surface:#151D33; --ink:#E9EEFB; --muted:#9AA6C4; --line:#26304D; --soft:#202B4D;
  --accent:#7C93FF; --accent-ink:#0C1223; --gold:#F5C04A; --good:#3DD68C; --bad:#FF6B73;
  --c-red:#FF6B73; --c-blue:#7C9BFF; --c-green:#3DD68C; --c-yellow:#F5C04A;
  --g1:#FF7A63; --g2:#A58BFF; --g3:#3FD6CF; --g4:#FFC24A; --g5:#FF72B8; --g6:#5BE08A; --g7:#78A0FF;
  --g1i:#0C1223; --g2i:#0C1223; --g3i:#0C1223; --g4i:#0C1223; --g5i:#0C1223; --g6i:#0C1223; --g7i:#0C1223;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
p{margin:0}
.mono{font-family:var(--f-mono)}
.lab{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.c1{--gc:var(--g1);--gc-ink:var(--g1i)}.c2{--gc:var(--g2);--gc-ink:var(--g2i)}.c3{--gc:var(--g3);--gc-ink:var(--g3i)}
.c4{--gc:var(--g4);--gc-ink:var(--g4i)}.c5{--gc:var(--g5);--gc-ink:var(--g5i)}.c6{--gc:var(--g6);--gc-ink:var(--g6i)}.c7{--gc:var(--g7);--gc-ink:var(--g7i)}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:24px}
.brand p{color:var(--muted);font-size:14px;margin-top:4px}
.stripe{display:flex;gap:3px;margin-top:10px}
.stripe i{width:24px;height:6px;border-radius:3px}
.stats{display:flex;align-items:flex-end;gap:20px;flex:1 1 300px;justify-content:flex-end;min-width:0;flex-wrap:wrap}
.rank{flex:1 1 180px;max-width:280px;min-width:0}
.rank-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank-name{font-family:var(--f-display);font-weight:700;font-size:17px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g4),var(--g6),var(--g7));transition:width .4s}
.streak{text-align:right}
.streak b{display:block;font-size:34px;line-height:1;font-weight:600}
.streak span{font-size:12px;color:var(--muted)}

.btn{font:600 15px var(--f-body);padding:12px 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;color:inherit;touch-action:manipulation}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.big{padding:16px 40px;font-size:18px}
.play .btn.primary,.result .btn.primary{background:var(--gc);color:var(--gc-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.home{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.home{grid-template-columns:300px minmax(0,1fr)}}
.right{display:flex;flex-direction:column;gap:26px;min-width:0}
.today{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;align-self:start}
.today .lab{color:inherit;opacity:.8}
.today p{opacity:.9;font-size:15px}
.today .btn{background:var(--accent-ink);color:var(--accent);align-self:flex-start}
.today .btn.alt{background:transparent;color:inherit;border-color:currentColor}
.today .btns{display:flex;flex-wrap:wrap;gap:10px}
.today :focus-visible{outline-color:var(--accent-ink)}
.today .focusline{font:600 13px var(--f-mono);opacity:.95}
.dots{display:flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor}
.dot.on{background:currentColor}
.dots .small{color:inherit;opacity:.85;margin-left:6px}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:176px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 18px 18px;cursor:pointer;font:inherit;transition:transform .15s,border-color .15s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--gc)}
.card:hover{border-color:var(--gc);transform:translateY(-2px)}
.cname{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2;padding-right:62px}
.cbest{margin-top:auto;display:flex;align-items:baseline;gap:8px}
.cbest b{font-size:22px;font-weight:600}
.glyph{position:absolute;top:20px;right:16px;width:48px;height:48px;border-radius:12px;background:var(--gc);color:var(--gc-ink);display:grid;place-items:center;font:600 14px var(--f-mono)}
.gtile{width:76px;height:76px;border-radius:18px;background:var(--gc);color:var(--gc-ink);display:grid;place-items:center;font:600 20px var(--f-mono)}
.mini{display:grid;grid-template-columns:repeat(3,10px);gap:3px}
.mini i{width:10px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--gc-ink) 30%,transparent)}
.mini i.on{background:var(--gc-ink)}
.gtile .mini{transform:scale(1.4)}

.sect{display:flex;flex-direction:column;gap:10px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font:600 12px var(--f-mono);padding:6px 12px;border-radius:99px;background:var(--gc);color:var(--gc-ink)}
.badge.lock{background:transparent;color:var(--muted);border:1px dashed var(--line)}

.play,.result{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--gc);border-radius:16px}
.play{padding:16px 18px 22px}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center}
.hud-mid{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hud-stat{text-align:right}
.hud-stat b{display:block;font-size:24px;line-height:1.1;font-weight:600}
.hud-stat b.low{color:var(--bad)}
.tbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.tbar i{display:block;height:100%;width:100%;background:var(--gc);transition:width .1s linear}
.stage{position:relative;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px 0 4px;border-radius:12px;text-align:center}
.stage.ok{animation:okp .4s}
.stage.bad{animation:badp .4s}
@keyframes okp{0%{background:color-mix(in srgb,var(--good) 24%,transparent)}100%{background:transparent}}
@keyframes badp{0%{background:color-mix(in srgb,var(--bad) 24%,transparent)}100%{background:transparent}}
.pop{position:absolute;left:50%;top:12%;font:700 24px var(--f-mono);pointer-events:none;animation:floatUp .8s forwards}
.pop.ok{color:var(--good)}.pop.bad{color:var(--bad)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-44px)}}
.chip{display:inline-block;font:600 12px var(--f-mono);padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--ink)}
.chip.gold{background:var(--gold);color:#1B1400}
.chip.combo{transition:background .2s}
.chip.hot{background:var(--gc);color:var(--gc-ink)}
.fb{min-height:1.5em;color:var(--muted);font-size:13px;max-width:420px}
.how{max-width:420px}

.mq{font-size:clamp(40px,12vw,64px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ans{width:min(240px,70%);font:600 40px var(--f-mono);text-align:center;background:transparent;color:var(--ink);border:0;border-bottom:3px solid var(--gc);padding:6px;border-radius:0}
.ans.txt{font-size:32px;text-transform:uppercase;letter-spacing:.15em}
.ans:focus,.ans:focus-visible{outline:none;border-bottom-width:6px}

.word{font:800 clamp(52px,16vw,96px)/1 var(--f-display);letter-spacing:-.02em;text-transform:uppercase}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(440px,100%)}
.opt{font:600 18px var(--f-body);padding:16px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.opt:hover{border-color:var(--gc)}
.opt .k{font-size:12px;color:var(--muted)}
.opt.num{font:600 26px var(--f-mono)}

.board{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;width:min(360px,100%)}
.tile{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;padding:0;transition:background .15s}
.tile.lit{background:var(--gc);border-color:var(--gc)}
.tile.ok{background:var(--good);border-color:var(--good)}
.tile.bad{background:var(--bad);border-color:var(--bad)}
.tile.miss{border:2px dashed var(--gc)}
.board.still .tile{cursor:default}

.odd{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;width:min(380px,100%)}
.odd button{aspect-ratio:1;border:0;border-radius:8px;cursor:pointer;padding:0}

.seqrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sn{min-width:56px;padding:12px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font:600 clamp(20px,6vw,28px) var(--f-mono)}
.sn.unk{border:2px dashed var(--gc);color:var(--gc)}

.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lt{width:clamp(38px,11vw,52px);height:clamp(46px,13vw,62px);display:grid;place-items:center;border-radius:10px;background:var(--gc);color:var(--gc-ink);font:700 clamp(22px,7vw,30px) var(--f-mono);text-transform:uppercase}
.bigbtn{width:min(360px,100%);padding:18px;font-size:20px}

.rule{font:600 13px var(--f-mono);letter-spacing:.08em}
.rule b{display:inline-block;margin-left:8px;font-size:26px;padding:2px 14px;border-radius:10px;background:var(--bad);color:var(--surface)}
.dg{font:700 clamp(72px,24vw,120px)/1 var(--f-mono);min-height:1.1em;color:var(--gc)}

.clock{position:relative;width:260px;height:260px;max-width:100%}
.clock i{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--line);transition:background .1s}
.clock i.on{background:var(--gc);box-shadow:0 0 0 6px color-mix(in srgb,var(--gc) 30%,transparent)}

.hunt{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:4px;width:min(380px,100%)}
.hunt button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 clamp(16px,5vw,24px) var(--f-mono);cursor:pointer;padding:0}
.hunt button:hover{border-color:var(--gc)}

.arena{position:relative;width:min(380px,100%);height:300px;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;touch-action:none;cursor:crosshair}
.orb{position:absolute;left:0;top:0;width:var(--d,64px);height:var(--d,64px);margin:calc(var(--d,64px) / -2) 0 0 calc(var(--d,64px) / -2);border-radius:50%;background:var(--gc);opacity:.5;transition:opacity .1s,box-shadow .1s}
.orb.on{opacity:1;box-shadow:0 0 0 8px color-mix(in srgb,var(--gc) 30%,transparent)}
.decoy{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:7px;animation:blink 1.1s forwards}
@keyframes blink{0%,100%{opacity:0}30%,70%{opacity:1}}

.breath{position:relative;width:240px;height:240px;display:grid;place-items:center;max-width:100%}
.ring{position:absolute;inset:0;border-radius:50%;border:3px dashed var(--gc)}
.orbb{width:240px;height:240px;max-width:100%;border-radius:50%;background:color-mix(in srgb,var(--gc) 55%,transparent);border:3px solid var(--gc);transform:scale(.3)}
.bl{font:700 22px var(--f-display)}

.result{padding:28px 22px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.big{font:600 clamp(72px,22vw,120px)/1 var(--f-mono);letter-spacing:-.04em;color:var(--gc)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:8px 0}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts dt{margin:0}
.facts dd{margin:0;font-size:22px;font-weight:600}
.xp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.xp .chip{font-size:14px;padding:6px 12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

.stripe i{animation:wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * .15s)}
@keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.big{animation:bump .5s}
@keyframes bump{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.glyph{transition:transform .2s}
.card:hover .glyph{transform:rotate(-7deg) scale(1.1)}
.newtag{position:absolute;top:0;right:0;font:700 10px var(--f-mono);letter-spacing:.1em;padding:4px 10px;border-radius:0 0 0 10px;background:var(--gold);color:#1B1400}
.left{display:flex;flex-direction:column;gap:20px;align-self:start;min-width:0}
@media (max-width:819px){.left{display:contents}.skills{order:2}.home>.right{order:1}}
.daily{display:flex;align-items:center;gap:16px;width:100%;border:0;border-radius:16px;padding:18px 20px;background:var(--gc);color:var(--gc-ink);cursor:pointer;text-align:left;font:inherit;transition:transform .15s}
.daily:hover{transform:translateY(-2px)}
.daily .gtile{background:var(--gc-ink);color:var(--gc);flex:none}
.daily .mini i{background:color-mix(in srgb,var(--gc) 30%,transparent)}
.daily .mini i.on{background:var(--gc)}
.daily h2{color:inherit;font-size:22px}
.daily .lab{color:inherit;opacity:.85}
.daily p{opacity:.92;font-size:14px}
.daily .dtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.daily:focus-visible{outline-color:var(--ink)}
.tip{font-size:13px;opacity:.95}
.skills{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sk{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;font-weight:600}
.sk .bar{margin:0}
.sk .bar i{background:var(--gc)}
.sk .mono{font-size:12px;color:var(--muted)}
.fgoal{height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 30%,transparent);overflow:hidden}
.fgoal i{display:block;height:100%;background:var(--accent-ink);transition:width .4s}

.sitring{--p:0;width:230px;height:230px;max-width:100%;border-radius:50%;background:conic-gradient(var(--gc) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center}
.sitin{width:184px;height:184px;max-width:80%;aspect-ratio:1;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sitin b{font:600 38px var(--f-mono)}
.pingbox{min-height:72px;display:grid;place-items:center}
.ping{width:64px;height:64px;border-radius:50%;border:0;background:var(--gc);color:var(--gc-ink);font:700 14px var(--f-mono);cursor:pointer;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gc) 55%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.durs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.durs .btn{min-width:84px}
.durs .btn.rec{border-color:var(--gc);box-shadow:inset 0 0 0 1px var(--gc)}

.passage{max-width:520px;text-align:left;font-size:18px;line-height:1.7;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px}
.qtext{font-size:22px;max-width:480px}
.stack{display:flex;flex-direction:column;gap:10px;width:min(480px,100%)}
.opt.wide{justify-content:flex-start;text-align:left}
.passage.gone{width:min(520px,100%);text-align:center;color:var(--muted);border-style:dashed;font-size:16px;padding:40px 20px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--bg))}

.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:min(440px,100%)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font:600 15px var(--f-body)}
.pr span{color:var(--gc)}
.cue{font:800 clamp(34px,10vw,54px)/1.1 var(--f-display);color:var(--gc)}

.flick{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;width:min(340px,100%)}
.flick button,.flick div{aspect-ratio:1;border:0;border-radius:8px;padding:0;background:var(--line)}
.flick button{cursor:pointer}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(300px,100%)}
.pad{aspect-ratio:1;border:0;border-radius:18px;opacity:.4;cursor:pointer;transition:opacity .1s,transform .1s;padding:0}
.pad.on{opacity:1;transform:scale(1.05)}

.premise{width:min(480px,100%);padding:12px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:18px;text-align:left}
.numgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(380px,100%)}
.nb{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 26px var(--f-mono);cursor:pointer}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 380px at 6% -4%,color-mix(in srgb,var(--g2) 18%,transparent),transparent),radial-gradient(480px 360px at 100% 8%,color-mix(in srgb,var(--g4) 16%,transparent),transparent),radial-gradient(560px 420px at 62% 112%,color-mix(in srgb,var(--g3) 16%,transparent),transparent)}

@keyframes spin{to{transform:rotate(360deg)}}
.card{background:linear-gradient(165deg,color-mix(in srgb,var(--gc) 13%,var(--surface)),var(--surface) 65%)}
.play,.result{background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 9%,var(--surface)),var(--surface) 260px)}

.quests{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--gc) 10%,var(--surface));cursor:pointer;font:inherit;color:inherit}

.rulecard{width:150px;height:150px;border-radius:26px;display:grid;place-items:center;font:600 76px var(--f-mono);transition:background .1s}
.rc0{background:var(--g7);color:var(--g7i)}
.rc1{background:var(--g4);color:var(--g4i)}
.sdk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:min(300px,100%);border:3px solid var(--ink);border-radius:10px;overflow:hidden}

.shape{display:grid;gap:3px;aspect-ratio:1}
.shape i{border-radius:3px;background:var(--line)}
.shape i.on{background:var(--gc)}
.shape.big{width:120px}
.shape.sm{width:84px}
.rots{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rots .opt{padding:12px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;width:min(460px,100%)}
.pc{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}

.dt{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 15px;font:600 13px var(--f-body);cursor:pointer}
.tab:hover{border-color:var(--accent)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabnote{margin-bottom:10px}
.snap{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;width:min(380px,100%)}
.sn2{display:grid;place-items:center;min-height:64px;font-size:30px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
button.pk{cursor:pointer;color:inherit;padding:0;font-family:inherit}
.pk.on{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 22%,var(--bg))}
.pk.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--bg))}
.pk.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--bg))}
.cform{display:grid;gap:8px;width:min(440px,100%);text-align:left}
.cform textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px;font:500 16px var(--f-body);resize:vertical}
.ans2{font:600 22px/1.4 var(--f-body);color:var(--gc);max-width:34ch}
.clist{display:grid;gap:8px;width:min(480px,100%);max-height:46vh;overflow:auto;text-align:left}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.crow small{display:block;color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px;margin-top:10px}
.wk div{display:grid;gap:4px;justify-items:center;align-content:end;height:100%;font:600 11px var(--f-mono);color:var(--muted)}
.wk i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.wk div.today i{background:var(--g3)}

.pg-alarm{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,#ff5ea866,transparent 50%),radial-gradient(circle at 80% 80%,#34d1ff66,transparent 50%),#0b0f1ecc;backdrop-filter:blur(6px);animation:pgFade .25s ease}
.pg-alarm-card{width:min(420px,100%);text-align:center;border-radius:28px;padding:32px 24px;color:#fff;background:linear-gradient(135deg,#7c3aed,#ec4899 55%,#f59e0b);box-shadow:0 24px 70px #0008;animation:pgPop .5s cubic-bezier(.2,1.4,.4,1)}
.pg-alarm-emoji{font-size:64px;animation:pgBell 1s ease-in-out infinite}
.pg-alarm-card h2{font:800 28px/1.15 var(--f-display,inherit);margin:8px 0}
.pg-alarm-body{opacity:.95;margin:0 0 6px}.pg-alarm-xp{font:700 14px var(--f-mono,monospace);background:#ffffff2e;display:inline-block;padding:6px 14px;border-radius:99px;margin:6px 0 0}
.pg-alarm-btns{display:grid;gap:10px;margin-top:22px}
.pg-go{border:0;border-radius:99px;padding:15px;font:800 16px inherit;background:#fff;color:#7c1d6f;cursor:pointer}
.pg-no{border:2px solid #fff9;border-radius:99px;padding:12px;font:700 15px inherit;background:transparent;color:#fff;cursor:pointer}
@keyframes pgFade{from{opacity:0}}@keyframes pgPop{from{transform:scale(.7);opacity:0}}@keyframes pgBell{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-6deg)}}

@keyframes pgShine{from{background-position:150% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){#pomo-app *,.pg-alarm,.pg-alarm *,.pg-intro *{animation:none!important}#pomo-app .pg-fx{display:none}}

#pomo-app .pg-plant{display:grid;justify-items:center;gap:2px;margin:2px 0 6px}

#pomo-app .pg-breathe{display:grid;place-items:center;height:110px;position:relative}

/* SVG tree */
.pgt{width:100%;height:auto;display:block;overflow:visible}
.pgt .tg{fill:color-mix(in srgb,var(--pg-accent) 22%,#86c872)}

.pgt .tspr,.pgt .tmain{transition:opacity .6s,transform .9s cubic-bezier(.34,1.4,.64,1)}
.pgt .tspr{transform-box:fill-box;transform-origin:50% 100%}
.pgt .ttr{fill:#7b5230;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.03);transition:transform 1.1s cubic-bezier(.3,1.15,.4,1)}
.pgt .tbr1,.pgt .tbr2{fill:none;stroke:#7b5230;stroke-linecap:round;opacity:0;transition:opacity .8s}
.pgt .tc{transform-box:fill-box;transform-origin:50% 90%;transform:scale(0);transition:transform 1s cubic-bezier(.34,1.5,.64,1)}
.pgt .tsway{transform-box:view-box;transform-origin:110px 100px;animation:tSway 6s ease-in-out infinite}
@keyframes tSway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
.pgt .tb{fill:#ffc4de;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:opacity .6s,transform .7s cubic-bezier(.34,1.8,.64,1)}
.pgt.bloom .tb{opacity:1;transform:scale(1)}
.pgt.fruit .tb{fill:#ffe1ee}
.pgt .tf circle:first-child{fill:#ff6b4a}
.pgt .tf{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:opacity .6s,transform .8s cubic-bezier(.34,1.8,.64,1)}
.pgt.fruit .tf{opacity:1;transform:scale(1)}
.pgt .tfl ellipse{fill:color-mix(in srgb,var(--pg-accent) 30%,#6bbf4e);opacity:0;transform-box:fill-box;transform-origin:center}
.pgt.alive .tfl .l1{animation:tFall 7s linear infinite}
.pgt.alive .tfl .l2{animation:tFall 8.5s linear 2.5s infinite}
.pgt.alive .tfl .l3{animation:tFall 9s linear 5s infinite}
@keyframes tFall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}100%{opacity:0;transform:translate(26px,92px) rotate(260deg)}}
.pgt .tbd{fill:none;stroke:#5b4a63;stroke-width:1.6;stroke-linecap:round;opacity:0}
.pgt.fruit .tbd{opacity:.65;animation:tFly 16s linear infinite}
@keyframes tFly{0%{transform:translate(0,0)}100%{transform:translate(190px,-14px)}}

@keyframes tBurst{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
@media (prefers-reduced-motion:reduce){.pgt *,#pomo-app .pg-owl,#pomo-app .pg-pane{animation:none!important}}

#appnav{position:fixed;z-index:9000;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:stretch;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 96%,transparent);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(30,20,90,.1)}
#appnav .an-brand{display:none}
#appnav button{flex:1;display:grid;justify-items:center;align-content:center;gap:1px;border:0;background:transparent;color:var(--muted);font:700 10.5px var(--f-body);padding:6px 2px;border-radius:14px;cursor:pointer;position:relative;min-width:0;-webkit-tap-highlight-color:transparent}
#appnav button i{font-style:normal;font-size:21px;line-height:1.15;transition:transform .2s}
#appnav button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
#appnav button.on i{transform:translateY(-1px) scale(1.12)}
#appnav .an-d{display:none}
#appnav button.an-on::after{content:"";position:absolute;top:6px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;background:#34c77b;animation:pgBreath 2.4s ease-in-out infinite}
body.sh-open{overflow:hidden}
@media (min-width:900px){
 #appnav{top:0;bottom:0;left:0;right:auto;width:90px;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 8px;border-top:0;border-right:1px solid var(--line);box-shadow:8px 0 24px rgba(30,20,90,.06)}
 #appnav .an-brand{display:grid;place-items:center;font-size:30px;margin-bottom:10px}
 #appnav .an-d{display:grid}#appnav .an-m{display:none}
 #appnav button{flex:none;padding:11px 2px}
 body{padding-left:98px;padding-bottom:24px}
}
html[data-env="morning"]{--bg:#FFF8EA;--soft:#FBEFD6}
html[data-env="evening"]{--bg:#FFF0E4;--soft:#FBE3D1}
html[data-env="morning"] body::before{background:radial-gradient(640px 420px at 4% -6%,rgba(255,214,120,.35),transparent),radial-gradient(560px 400px at 100% 4%,rgba(140,220,170,.28),transparent)}
html[data-env="evening"] body::before{background:radial-gradient(640px 420px at 4% -6%,rgba(255,150,90,.3),transparent),radial-gradient(560px 400px at 100% 4%,rgba(190,120,220,.25),transparent)}
html[data-env="night"] body::before{background:radial-gradient(640px 420px at 4% -6%,rgba(90,100,255,.25),transparent),radial-gradient(560px 400px at 100% 4%,rgba(160,80,220,.2),transparent)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:9500;display:grid;align-items:end}
.sheet-b{position:absolute;inset:0;background:rgba(10,8,30,.55);animation:shFade .25s}
.sheet-p{position:relative;background:var(--surface);color:var(--ink);border-radius:26px 26px 0 0;max-height:90vh;overflow:auto;overscroll-behavior:contain;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.35);animation:shUp .32s cubic-bezier(.2,.9,.3,1)}
.sheet-x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:15px;cursor:pointer;z-index:2}
@keyframes shUp{from{transform:translateY(40px);opacity:0}}@keyframes shFade{from{opacity:0}}
@media (min-width:900px){.sheet{align-items:center;justify-items:center}.sheet-p{width:min(680px,92vw);border-radius:26px;padding:26px}}
.sx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-right:44px;flex-wrap:wrap}
.sx-head h3{font:800 24px var(--f-display);letter-spacing:-.02em}
.sx-sub,.sx-small{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.sx-lbl{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.sx-lbl b{color:var(--accent)}
.sx-play{border:0;border-radius:99px;padding:11px 20px;font:800 14px var(--f-body);color:#fff;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--g5)));cursor:pointer;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent);display:inline-flex;gap:8px;align-items:center}
.sx-play.on{background:linear-gradient(135deg,#2fb877,#1d8f63)}
.sx-bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.sx-bars i{width:3px;background:#fff;border-radius:2px;animation:sxBar 1s ease-in-out infinite}
.sx-bars i:nth-child(1){height:6px}.sx-bars i:nth-child(2){height:12px;animation-delay:-.3s}.sx-bars i:nth-child(3){height:8px;animation-delay:-.6s}
@keyframes sxBar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.sx-pres{display:flex;flex-wrap:wrap;gap:8px}
.sx-pre{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 14px;font:700 13px var(--f-body);cursor:pointer;transition:all .2s}
.sx-pre.sug{border-color:var(--accent)}
.sx-pre.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.sx-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sx-card{display:grid;gap:5px;padding:12px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);transition:border-color .2s,background .2s}
.sx-card.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.sx-top{display:flex;gap:8px;align-items:center}.sx-top span{font-size:22px}.sx-top b{font:800 14px var(--f-display)}
.sx-card small{font-size:11.5px;color:var(--muted);line-height:1.35;min-height:30px}
.sx-card input[type=range],.sx-foot input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.sx-foot{display:grid;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sx-row{display:grid;gap:4px;font:700 13px var(--f-body)}
.sx-row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:700 13px var(--f-body)}
.sx-chips{display:flex;gap:6px;flex-wrap:wrap}
.sx-chips button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 12px;font:700 12px var(--f-body);cursor:pointer}
.sx-chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sx-switch{display:flex;gap:12px;align-items:center;font:600 14px var(--f-body);cursor:pointer;padding:8px 0}
.sx-switch input{position:absolute;opacity:0;pointer-events:none}
.sx-switch i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sx-switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.sx-switch input:checked+i{background:var(--accent)}
.sx-switch input:checked+i::after{transform:translateX(18px)}
.sx-switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.sx-switch small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.st-env{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.st-env{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st-e{display:grid;gap:2px;justify-items:center;padding:14px 8px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
.st-e i{font-style:normal;font-size:28px}.st-e b{font:800 14px var(--f-display)}.st-e small{font-size:11px;color:var(--muted)}
.st-e.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.mo-list{display:grid;gap:10px;margin-top:16px}
.mo-list button{display:grid;grid-template-columns:42px 1fr;gap:2px 12px;text-align:left;padding:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
.mo-list i{grid-row:span 2;font-style:normal;font-size:28px;align-self:center}.mo-list b{font:800 15px var(--f-display)}.mo-list span{font-size:12.5px;color:var(--muted)}
/* world scene */
#pomo-app .pg-bigbox.pg-world{width:100%;max-width:none;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(20,20,60,.18)}
.wsc{display:block;width:100%;height:auto;--sky1:#7ec8ff;--sky2:#eaf7ff;--hill1:#9ad88a;--hill2:#6fbf6a;--grass:#58aa57;--water:#6fb6e8;--starop:0;--cloudop:.95;--glowop:0;--ffop:0;--sunx:320px;--suny:42px;--sunc:#ffd45e}
html[data-env="evening"] .wsc{--sky1:#4b4a8f;--sky2:#ffb07a;--hill1:#6d8f6a;--hill2:#4f7f5c;--grass:#3f6f4d;--water:#5d86b8;--starop:.15;--cloudop:.6;--glowop:.55;--sunx:335px;--suny:98px;--sunc:#ff9a4c}
html[data-env="night"] .wsc{--sky1:#070d26;--sky2:#26335f;--hill1:#1f3a3a;--hill2:#17302f;--grass:#12292a;--water:#1b3b66;--starop:1;--cloudop:.15;--glowop:1;--ffop:1;--sunx:325px;--suny:40px;--sunc:#f5f0d8}
.wsc .wsun{cx:var(--sunx);cy:var(--suny);fill:var(--sunc);transition:cx 1.5s,cy 1.5s,fill 1.5s;filter:drop-shadow(0 0 8px var(--sunc))}
.wsc .wstars{opacity:var(--starop);transition:opacity 1.5s}
.wsc .wcl{fill:#fff;opacity:var(--cloudop);animation:wDrift 60s linear infinite}.wsc .wcl2{animation-duration:90s;animation-delay:-30s}
@keyframes wDrift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.wsc .wh1{fill:var(--hill1)}.wsc .wh2{fill:var(--hill2)}.wsc .wgr{fill:var(--grass)}
.wsc .wl1{fill:color-mix(in srgb,var(--grass) 55%,#3fae4d)}.wsc .wl2{fill:color-mix(in srgb,var(--grass) 40%,#6fcf6a)}
.wsc .wpond{fill:var(--water)}
.wsc .wrip{transform-box:fill-box;transform-origin:center;animation:wRip 3.6s ease-out infinite}
@keyframes wRip{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.8);opacity:0}}
.wsc .wd,.wsc .wt{opacity:0;transform:scale(.4);transition:opacity .9s ease,transform 1.1s cubic-bezier(.34,1.5,.64,1)}
.wsc .wd.on,.wsc .wt.on{opacity:1;transform:none}
.wsc .wbf{transform:none}
.wsc .wlg{opacity:var(--glowop);transition:opacity 1.5s}
.wsc .wwin{opacity:calc(.35 + var(--glowop)*.65)}
.wsc .wsmoke circle{fill:#fff;opacity:.5;animation:wSmoke 4s ease-out infinite}.wsc .wsmoke circle:nth-child(2){animation-delay:-1.3s}.wsc .wsmoke circle:nth-child(3){animation-delay:-2.6s}
@keyframes wSmoke{0%{transform:translate(0,6px) scale(.5);opacity:.6}100%{transform:translate(8px,-14px) scale(1.4);opacity:0}}
.wsc .wflame{transform-box:fill-box;transform-origin:50% 100%;animation:wFlame .5s ease-in-out infinite alternate}
@keyframes wFlame{from{transform:scaleY(.85) scaleX(1.05)}to{transform:scaleY(1.15) scaleX(.9)}}
.wsc .wfly{animation:wFly 14s ease-in-out infinite}.wsc .wfly2{animation-duration:19s;animation-delay:-7s}
@keyframes wFly{0%{transform:translate(120px,170px)}25%{transform:translate(180px,150px)}50%{transform:translate(250px,175px)}75%{transform:translate(200px,190px)}100%{transform:translate(120px,170px)}}
.wsc .wff{opacity:var(--ffop);animation:wBlink 3s ease-in-out infinite}
@keyframes wBlink{0%,100%{opacity:0}50%{opacity:var(--ffop)}}
.wsc .wshoot{opacity:var(--starop);animation:wShoot 7s ease-in infinite}
@keyframes wShoot{0%,80%{transform:translate(0,0);opacity:0}84%{opacity:1}100%{transform:translate(-90px,50px);opacity:0}}
.wsc .pgt .tg,.wsc .pgt .tg2{opacity:0}
.pg-wnext{font-size:13px;color:var(--pg-muted);text-align:center}
.pg-wlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pg-wlist span{display:grid;font-size:12px;padding:6px 11px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--pg-accent) 30%,transparent);color:var(--pg-muted)}
.pg-wlist span.on{color:var(--pg-ink);border:1px solid color-mix(in srgb,var(--pg-accent) 55%,transparent);background:color-mix(in srgb,var(--pg-accent) 10%,transparent)}
.pg-wlist small{font-size:10px;opacity:.8}
#pomo-app .pg-fmbtn{width:100%;margin-top:2px}
/* focus mode */
.fm{position:fixed;inset:0;z-index:9995;display:grid;grid-template-rows:auto 1fr auto;color:#fff;background:linear-gradient(170deg,#13204a,#2a2f6b 60%,#3b2a63);animation:shFade .4s;overflow:hidden}
html[data-env="morning"] .fm{background:linear-gradient(170deg,#2c6b8f,#4f9a9a 55%,#8bc58f)}
html[data-env="evening"] .fm{background:linear-gradient(170deg,#3a2f6b,#9a4a6a 55%,#e08a52)}
html[data-env="night"] .fm{background:linear-gradient(170deg,#070d26,#16204a 60%,#251a45)}
.fm-x{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:9px 16px;font:700 13px var(--f-body);cursor:pointer;z-index:2}
.fm-c{grid-row:2;display:grid;justify-items:center;align-content:center;gap:14px;text-align:center;padding:20px}
.fm-phase{font:700 12px var(--f-mono);letter-spacing:.3em;opacity:.8}
.fm-time{font:700 clamp(64px,22vw,150px)/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(255,255,255,.3)}
.fm.run .fm-time{text-shadow:0 0 50px rgba(160,255,200,.45)}
.fm-task{font:600 18px var(--f-display);opacity:.92;max-width:28ch}
.fm-orb{position:relative;width:110px;height:110px;display:grid;place-items:center;margin-top:6px}
.fm-orb i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.35);animation:fmBreathe 8s ease-in-out infinite}
.fm-orb span{position:relative;font:600 12px var(--f-body);opacity:0;animation:fmTxt 8s ease-in-out infinite}
.fm-orb .b2{position:absolute;animation-delay:-4s}
@keyframes fmBreathe{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
@keyframes fmTxt{0%,8%{opacity:0}18%,40%{opacity:1}50%,100%{opacity:0}}
.fm-tree{width:130px;opacity:.95}
.fm-room{font-size:13px;opacity:.85}
.fm-bar{grid-row:3;display:flex;gap:10px;justify-content:center;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.fm-bar button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:12px 24px;font:700 14px var(--f-body);cursor:pointer}
.fm-bar #fm-pp{background:#fff;color:#2a2f6b;border-color:#fff;min-width:140px}
.fm{--pg-accent:#4fae6e;--pg-ink:#fff;--pg-muted:#cfd6ee;--pg-glow:#b8e6b8}
.fm .pgt .tg,.fm .pgt .tg2{opacity:1}
html.no-anim .fm-orb i,html.no-anim .fm-orb span{animation:none!important}
html.no-anim .fm-orb i{transform:scale(.85)}
html.no-anim .fm-orb .b1{opacity:1}
html.no-anim .wsc .wd,html.no-anim .wsc .wt{transition:none}

body.in-app #top{display:none}
#pomo-app .pg-hero{padding:14px 18px 16px;gap:6px}
#pomo-app .pg-hero .pg-topline{min-height:0;height:auto;display:flex;justify-content:flex-end;position:absolute;right:14px;top:12px}
#pomo-app .pg-hero{position:relative}
#pomo-app .pg-hero .pg-back,#pomo-app .pg-hero .pg-kicker,#pomo-app .pg-hero .pg-greet,#pomo-app .pg-hero .pg-rank,#pomo-app .pg-hero .pg-tl2>button:first-child{display:none!important}

/* ===== v8: study buddy ===== */
.bud-c{position:fixed;z-index:9400;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:24px;padding:16px;box-shadow:0 18px 50px rgba(20,10,60,.35);animation:budUp .45s cubic-bezier(.2,.9,.3,1.1);display:grid;gap:10px}
@keyframes budUp{from{transform:translate(-50%,30px);opacity:0}}

.bud-hd>div{flex:1;min-width:0}.bud-hd b{display:block;font:800 15px var(--f-display)}.bud-hd small{font:600 11px var(--f-mono);color:var(--muted)}

.bud-m{font:600 16px/1.45 var(--f-display)}
.bud-x2{font-size:13px;color:var(--muted);margin-top:-4px}
.bud-bar{position:relative;height:9px;border-radius:9px;background:var(--soft);overflow:visible}

.bud-ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.bud-b2{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:11px 10px;font:700 13px var(--f-body);cursor:pointer}
.bud-b3{grid-column:1/-1;border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:4px;cursor:pointer}
.bud-grade{display:flex;align-items:center;gap:12px}.bud-grade b{font:800 40px var(--f-display);color:var(--accent);line-height:1}.bud-grade span{font-size:13px;color:var(--muted)}
.bud-q{font:700 13px var(--f-body)}.bud-pr{display:flex;gap:6px;flex-wrap:wrap}.bud-pr button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 12px;font:700 12px var(--f-body);cursor:pointer}.bud-pr button:hover{border-color:var(--accent)}
.bs-in{width:100%;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body)}
.sx-row2 .bs-in{width:auto;flex:1}

/* ===== scene: time in the art ===== */
.sw{--sp:0;--sunk:1}
.sw.ph-night{--sunk:.35}.sw.th-obs{--sunk:.2}
.sw .swwax{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(calc(1 - var(--sp)*.78));transition:transform 1s linear}
.sw .swflame{transform:translateY(calc(var(--sp)*34px));transition:transform 1s linear}
.sw .swflame ellipse:first-child{animation:swFl 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes swFl{0%,100%{transform:scale(1,1)}35%{transform:scale(.92,1.08) skewX(2deg)}70%{transform:scale(1.05,.94) skewX(-2deg)}}
.sw .swcof,.sw .swcofs{transition:transform 1s linear;transform:translateY(calc(var(--sp)*17px))}
.sw .swwash{opacity:calc(var(--sp)*.5*var(--sunk));transform:translateX(calc(var(--sp)*-140px));transition:opacity 1s linear,transform 1s linear}

.sw .swshoot{stroke:#fff;stroke-width:1.6;stroke-linecap:round;opacity:0;animation:swShoot 11s ease-in infinite}

.sw-wind .swflame,.sw-wind .swsteam,.sw-wind .swwash,.sw-wind .swsetg{opacity:0}
.sw-wind .swhead{transform:rotate(-3deg) translateY(5px)}
.sw-wind .swdust circle{opacity:0}
.sw-wind .sw-dock{background:rgba(18,12,8,.7)}
.sw-wind .sw-note{opacity:.5;filter:saturate(.5)}.sw-wind #sw-sk{display:none}

<script>
(function(){

var app=$('#app');

/* ---------- saved progress ---------- */

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yesterdayKey(){var d=new Date();d.setDate(d.getDate()-1);return dayKey(d)}
function histAdd(sec,xp){S.hist=S.hist||{};var k=dayKey(),h=S.hist[k]||(S.hist[k]={sec:0,xp:0,n:0});h.sec+=sec;h.xp+=xp;h.n++;var keys=Object.keys(S.hist).sort();while(keys.length>21)delete S.hist[keys.shift()]}
function weekHtml(){S.hist=S.hist||{};var days=[],mx=1,tot=0,i,d,k,v;
for(i=6;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);k=dayKey(d);v=Math.round(((S.hist[k]||{}).sec||0)/60);days.push({k:k,v:v,l:'SMTWTFS'.charAt(d.getDay()),t:i===0});mx=Math.max(mx,v);tot+=v}
return '<section class="skills"><p class="lab mono">LAST 7 DAYS · FOCUS MINUTES</p><div class="wk">'+days.map(function(x){return '<div'+(x.t?' class="wk-now"':'')+'><span>'+(x.v||'')+'</span><i style="height:'+Math.round(x.v/mx*70)+'px"></i><span>'+x.l+'</span></div>'}).join('')+'</div><p class="small">'+tot+' minutes this week. Aim to beat last week by a few minutes, not by a lot.</p></section>'}
function rollDay(){var t=dayKey();if(S.day!==t){S.day=t;S.rounds=0;S.todayGames=[];S.todaySec=0}}
function liveStreak(){return(S.lastGoalDay===dayKey()||S.lastGoalDay===yesterdayKey())?S.streak:0}
function fmtSec(s){var m=Math.floor(s/60);return m+' min '+(s%60)+' s'}

/* ---------- sound and effects ---------- */
var AC=null;
function sfx(k){
  if(S.mute)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime,notes={ok:[[660,0],[880,.07]],bad:[[170,0]],win:[[523,0],[659,.09],[784,.18],[1047,.27]],start:[[392,0],[587,.1]]}[k]||[];
    notes.forEach(function(n){
      var o=AC.createOscillator(),g=AC.createGain(),s=t+n[1];
      o.type=k==='bad'?'sawtooth':'triangle';o.frequency.value=n[0];
      g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.1,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+.2);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.22);
    });
  }catch(e){}
}
/* Animations on/off: one switch for the whole app, remembered on this device. Off saves battery. */
var animOff=false;
try{animOff=localStorage.getItem('bg-anim-off')==='1'}catch(e){}
function animLabel(){return animOff?'✨ Animations: off':'✨ Animations: on'}
function applyAnim(){
  document.documentElement.classList.toggle('no-anim',animOff);
  document.querySelectorAll('#anim,#pg-anim').forEach(function(b){b.textContent=b.id==='pg-anim'?(animOff?'✨ Animations off':'✨ Animations on'):animLabel()});
  if(animOff){document.querySelectorAll('.confetti,.pg-fl').forEach(function(e){e.remove()})}
}
function setAnim(off){animOff=!!off;try{localStorage.setItem('bg-anim-off',animOff?'1':'0')}catch(e){}applyAnim()}
applyAnim();
function confetti(){if(animOff)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var box=document.createElement('div');box.className='confetti';
  for(var i=0;i<46;i++){var p=document.createElement('i');
    p.style.left=r(0,100)+'%';p.style.background='var(--g'+(i%7+1)+')';
    p.style.setProperty('--dx',r(-90,90)+'px');p.style.setProperty('--rot',r(180,900)+'deg');
    p.style.animationDelay=(Math.random()*.5)+'s';p.style.animationDuration=(1.4+Math.random())+'s';box.appendChild(p)}
  document.body.appendChild(box);setTimeout(function(){box.remove()},3000);
}

/* ---------- helpers ---------- */
var cleanups=[];
function stop(){cleanups.forEach(function(f){try{f()}catch(e){}});cleanups=[]}
function every(fn,ms){var id=setInterval(fn,ms);cleanups.push(function(){clearInterval(id)})}
function later(fn,ms){var id=setTimeout(fn,ms);cleanups.push(function(){clearTimeout(id)})}
function onKey(fn){document.addEventListener('keydown',fn);cleanups.push(function(){document.removeEventListener('keydown',fn)})}
function tapBtn(btn,fn){btn.addEventListener('click',function(){fn();btn.blur()});onKey(function(e){if(e.code==='Space'){e.preventDefault();fn()}})}
function r(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=r(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function timer(api,T,onEnd){
  var end=Date.now()+T;api.setTime(Math.ceil(T/1000)+'s',1,'TIME');
  every(function(){
    var left=end-Date.now(),el=$('#time');
    if(el)el.classList.toggle('low',left<=10000&&left>0);
    if(left<=0){api.setTime('0s',0);onEnd();return}
    api.setTime(Math.ceil(left/1000)+'s',left/T);
  },100);
}
function streakPts(streak){return 10+Math.min(streak-1,5)*2}

/* ---------- game list ---------- */
var GAMES=[

 {id:'watch',group:'focus',name:'Night Watch',skill:'Vigilance',tag:'A light circles a clock. Catch the rare double jump.',how:'A light moves one dot at a time around the clock. Once in a while it skips a dot. Tap the moment you see it skip. Space also works.',glyph:'12'},
 {id:'hunt',group:'focus',name:'Needle Hunt',skill:'Visual search',tag:'Find the one different character in a crowd of look-alikes.',how:'A grid of near-identical characters hides one that is different. Find it fast. The grid grows as you improve.',glyph:'O/Q'},

 {id:'breath',group:'focus',name:'Breath Sync',skill:'Calm focus',tag:'Breathe with the circle and tap exactly at the peak.',how:'Breathe in as the circle grows and out as it shrinks. Tap when it touches the dashed ring. Eight breaths. Space also works.',glyph:'ZEN'},

 {id:'odd',group:'mind',name:'Odd Shade Out',skill:'Vision',tag:'One tile is a slightly different shade. Spot it fast.',how:'One tile has a slightly different shade. Tap it. The shades get closer as you improve.',glyph:'<span class="mini"><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i></span>'},

 {id:'digit',group:'mind',name:'Digit Echo',skill:'Memory span',tag:'Watch digits flash, then type them back, later in reverse.',how:'Digits flash one at a time. Type them back in order. From round 5, every other round asks for reverse order. Three misses end the round.',glyph:'471'},

 {id:'flick',group:'focus',name:'Flicker Spot',skill:'Change detection',tag:'The grid blinks. Tap the one square that changed.',how:'A grid of colours shows briefly, blinks off, and returns with exactly one square changed. Tap it.',glyph:'Δ'},
 {id:'echo',group:'mind',name:'Pattern Echo',skill:'Sequence memory',tag:'Watch the pads light up, then repeat the sequence.',how:'Pads light up in a sequence. Repeat it by tapping the pads in the same order. It grows by one step each time. Three lives.',glyph:'1-2-3'},
 {id:'count',group:'focus',name:'Silent Count',skill:'Counting under load',tag:'Count one letter in a fast stream. No fingers, no lips.',how:'A target letter is announced. Letters flash one by one. Count the target silently, then pick the total. Three lives.',glyph:'#K'},
 {id:'once',group:'learn',name:'One Pass',skill:'First-read trust',tag:'Read once, no going back. Then test how well you really understood.',how:'The text appears one sentence at a time and fades before you can re-read it. Read each piece once. Then rate how well you understood and answer. Honest ratings earn bonus points, so you learn to trust your first read.',glyph:'1×'},
 {id:'flex',group:'focus',name:'Rule Switch',skill:'Mental flexibility',tag:'The rule changes without warning. Keep up.',how:'Numbers appear one at a time. Follow the rule shown on top. Every few cards the rule switches between Odd or Even and Low or High. Keys 1 and 2 work.',glyph:'⇄'},
 {id:'logic',group:'think',name:'Logic Lock',skill:'Deduction',tag:'Does the conclusion follow? Made-up words, real logic.',how:'Read two statements, then decide whether the conclusion must follow from them. The words are invented, so only logic counts. Keys 1 and 2 work.',glyph:'∴'},

 {id:'sudoku',group:'lab',name:'Mini Sudoku',skill:'Quiet puzzling',tag:'Solve fresh 4×4 sudoku grids for four calm minutes.',how:'Tap an empty square to cycle through 1 to 4. Every row, column and 2×2 box must hold 1 to 4 exactly once. Each puzzle is new. Solve as many as you can in four minutes.',glyph:'4×4'},
 {id:'rot',group:'lab',name:'Rotation Lab',skill:'Spatial thinking',tag:'Find the shape that is the same, only turned.',how:'Find the option that is the target turned around, not flipped like a mirror. The patterns grow larger as you improve. Keys 1 to 3 work.',glyph:'⟳'},

 {id:'who',group:'learn',name:'Who Was Who',skill:'Quiet memorising',tag:'Meet a few people silently, then recall who is who.',how:'Study the short profiles silently. Then answer who lives where and who loves what. Recall 75% or more to level up. Every round has new people.',glyph:'WHO'},

 {id:'prime',group:'mind',name:'Prime Pulse',skill:'Number logic',tag:'Decide whether each number is prime before the pulse fades.',how:'Tap PRIME if the number has exactly two factors, otherwise COMPOSITE. Keep a clean streak for bonus points.',glyph:'P!'},
 {id:'compare',group:'mind',name:'Number Ninja',skill:'Mental speed',tag:'Compare two numbers quickly and trust your number sense.',how:'Tap the larger number. Numbers change every round and speed up as you score.',glyph:'> <'},

 {id:'drcr',group:'study',name:'Debit or Credit',skill:'Accounting reflex',tag:'Which side does it go? Build the golden rules into instinct.',how:'An account appears and it increases or decreases. Tap Debit or Credit. A wrong answer shows the rule. Speed builds recall.',glyph:'Dr'},

 {id:'ratio',group:'study',name:'Ratio Rush',skill:'Financial ratios',tag:'Current, quick and gross profit ratios from raw figures.',how:'Work out the ratio from the figures shown and pick the right answer. Wrong answers show the formula.',glyph:'R:1'},

 {id:'react',group:'focus',name:'Reflex Tap',skill:'Reaction speed',tag:'Wait for green, then tap as fast as you can.',how:'The pad is red. When it turns green, tap at once. Tapping early costs points. Eight trials. Space also works.',glyph:'GO!'}
];

var SKCOL={Focus:1,Stamina:2,Memory:3,Speed:4,Logic:5,Learning:6};
var TIPS=['Put your phone in another room before a Deep Sit. Out of sight helps most.','Add two minutes to your longest sit each week. Small steps build stamina.','Read silently without moving your lips. It keeps your attention on meaning.','After reading, look away and recall three points. Recall beats re-reading.','Breathe out slowly before a hard task. It settles the mind.','Short daily practice beats one long session. Keep the streak alive.','Sit with your feet flat and your back supported. Comfort lets you stay longer.','The urge to re-read is often a feeling, not a need. Close the page and say the main idea aloud to test it.'];
function questList(){
  var s=dayKey(),h=0,i;for(i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%9973;
  var A=['stroop','go','watch','hunt','orb','flick','count','flex','twin','dots'],B=['read','pair','once','who','detail'],C=['math','grid','seq','odd','word','back','digit','echo','sudoku','logic','rot','target','prime','compare','recall','drcr','gst','ratio','depr','bal'];
  return [A[h%A.length],B[(h*3+1)%B.length],C[(h*7+2)%C.length]];
}
function ensureQuest(){
  if(S.quest&&S.quest.day===dayKey())return;
  var ids=questList(),t={};ids.forEach(function(id){t[id]=Math.max(25,Math.round((S.best[id]||0)*.7))});
  S.quest={day:dayKey(),ids:ids,targets:t,done:{}};save();
}

  function add(g){if(g&&out.indexOf(g)<0&&out.length<6)out.push(g)}
  weak.slice(0,2).forEach(function(sk,k){
    var c=GAMES.filter(function(g){return SKM[g.id]===sk&&S.todayGames.indexOf(g.id)<0});
    if(c.length)add(c[(h+k*3)%c.length]);
    if(c.length>1)add(c[(h+k*3+1)%c.length]);
  });
  var fresh=GAMES.filter(function(g){return !S.played[g.id]});
  for(var i=0;i<2&&fresh.length;i++)add(fresh[(h+i*5)%fresh.length]);
  var rest=GAMES.filter(function(g){return S.todayGames.indexOf(g.id)<0&&out.indexOf(g)<0});
  for(var j=0;out.length<6&&rest.length&&j<40;j++)add(rest[(h+j*7)%rest.length]);
  return {games:out,weak:weak[0]};
}

RUNNERS.go=function(api,done){

  api.stage.innerHTML='<p class="rule mono">DO NOT TAP<b id="ng">3</b></p><div class="dg" id="dg"></div>'+

  function slip(pts,msg){streak=0;slips++;score=Math.max(0,score-pts);api.setScore(score);api.combo(0);fb.textContent=msg;api.pop('-'+pts,'bad');api.flash('bad')}

/* ---------- Night Watch (vigilance) ---------- */
RUNNERS.watch=function(api,done){
  var T=90000,STEP=800,N=12,R=104,pos=0,steps=0,nextDouble=r(6,12),pending=null,hits=0,miss=0,fa=0,score=0,over=false;
  api.stage.innerHTML='<div class="clock" id="clock"></div><button class="btn primary bigbtn" id="tap">It skipped!</button>'+
    '<p class="fb mono" id="fb">The light moves one dot at a time. Tap when it skips a dot. Space also works.</p>';
  var clock=$('#clock'),fb=$('#fb'),dots,h='';
  for(var i=0;i<N;i++){var a=i/N*Math.PI*2-Math.PI/2;h+='<i style="left:'+(130+Math.cos(a)*R).toFixed(1)+'px;top:'+(130+Math.sin(a)*R).toFixed(1)+'px"></i>'}
  clock.innerHTML=h;dots=clock.children;
  function light(){for(var i=0;i<N;i++)dots[i].classList.toggle('on',i===pos)}
  function step(){
    if(over)return;
    var now=Date.now();
    if(pending&&!pending.caught&&now-pending.t>=1400){miss++;pending=null;fb.textContent='Missed a skip. Stay with the light.'}
    steps++;var dbl=steps>=nextDouble;
    if(dbl){steps=0;nextDouble=r(6,12);pending={t:now,caught:false}}
    pos=(pos+(dbl?2:1))%N;light();
    later(step,STEP);
  }
  function tap(){
    if(over)return;
    if(pending&&!pending.caught){pending.caught=true;hits++;score+=25;api.setScore(score);api.chip('Caught '+hits,hits>=3);fb.textContent='Caught it';api.pop('+25','ok');api.flash('ok')}
    else{fa++;score=Math.max(0,score-5);api.setScore(score);fb.textContent='No skip there';api.pop('-5','bad');api.flash('bad')}
  }
  tapBtn($('#tap'),tap);
  api.chip('Caught 0',false);
  function end(){if(over)return;over=true;if(pending&&!pending.caught)miss++;done({score:score,combo:hits,xp:Math.round(score/4),facts:[['Skips caught',hits],['Missed',miss],['False alarms',fa]]})}
  light();later(step,STEP);timer(api,T,end);
};

RUNNERS.math=function(api,done){

  api.stage.innerHTML='<div class="mq mono" id="mq"></div>'+
    '<input id="ans" class="ans" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Your answer"><p class="fb mono" id="fb">Type the answer. It checks itself.</p>';

  function mul(a,b){cur=a+' × '+b;ans=a*b}

    var lv=Math.min(4,Math.floor(solved/5)),p=Math.random();

/* ---------- Flash Grid ---------- */
RUNNERS.grid=function(api,done){
  var level=1,lives=3,cleared=0,size=3,target=new Set(),found=new Set(),phase='show',over=false;
  api.setTime('3',1,'LIVES');api.chip('Level 1',false);

    if(over)return;

/* ---------- What Comes Next ---------- */
RUNNERS.seq=function(api,done){
  var T=90000,score=0,streak=0,bestStreak=0,solved=0,wrong=0,cur=null,t0=0,over=false;
  function arith(){var neg=Math.random()<.2,d=r(2,12),a=neg?r(60,99):r(2,30),s=neg?-d:d;return[0,1,2,3,4,5].map(function(i){return a+s*i})}
  function geo(){var a=r(1,4),m=r(2,3);return[0,1,2,3,4,5].map(function(i){return a*Math.pow(m,i)})}
  function sq(){var n=r(2,8),k=r(0,6);return[0,1,2,3,4,5].map(function(i){return(n+i)*(n+i)+k})}
  function alt(){var s=r(1,10),a=r(2,6),b=r(7,12),o=[s];for(var i=1;i<6;i++)o.push(o[i-1]+(i%2?a:b));return o}
  function grow(){var s=r(1,10),d=r(1,4),o=[s];for(var i=1;i<6;i++)o.push(o[i-1]+d+i-1);return o}
  function fib(){var o=[r(1,5),r(2,6)];for(var i=2;i<6;i++)o.push(o[i-1]+o[i-2]);return o}
  function dbl(){var op=Math.random()<.5?1:-1,o=[r(2,5)];for(var i=1;i<6;i++)o.push(o[i-1]*2+op);return o}
  function cube(){var n=r(1,5);return[0,1,2,3,4,5].map(function(i){return Math.pow(n+i,3)})}
  function mixed(){var s=r(1,4),k=r(1,5),o=[s];for(var i=1;i<6;i++)o.push(i%2?o[i-1]*2:o[i-1]+k);return o}
  var makers=[arith,geo,sq,alt,grow,fib,dbl,cube,mixed];
  api.stage.innerHTML='<div class="seqrow" id="srow"></div><div class="choices" id="opts"></div><p class="fb mono" id="fb">Find the rule. Keys 1 to 4 also work.</p>';
  var fb=$('#fb');
  function next(){
    var pool=solved<4?3:solved<9?6:9,seq=makers[r(0,pool-1)](),ans=seq[5],last=Math.abs(seq[5]-seq[4])||1;
    var opts=new Set([ans]),naive=seq[4]+(seq[4]-seq[3]);
    if(naive!==ans&&naive>0)opts.add(naive);
    shuffle([last,-last,1,-1,2,-2,3,-3,5,-5,10,-10]).forEach(function(o){if(opts.size<4&&ans+o>0)opts.add(ans+o)});
    cur={ans:ans,opts:shuffle(Array.from(opts))};
    $('#srow').innerHTML=seq.slice(0,5).map(function(n){return '<span class="sn">'+n+'</span>'}).join('')+'<span class="sn unk">?</span>';
    $('#opts').innerHTML=cur.opts.map(function(v,i){return '<button class="opt num" data-v="'+v+'"><span class="k mono">'+(i+1)+'</span>'+v+'</button>'}).join('');
    t0=Date.now();
  }
  function choose(v){

    if(v===cur.ans){streak++;if(streak>bestStreak)bestStreak=streak;var pts=10+(Date.now()-t0<4000?5:0)+Math.min(streak-1,5)*2;score+=pts;solved++;fb.textContent=pts>=15?'Fast and correct':'Correct';api.pop('+'+pts,'ok');api.flash('ok')}
    else{streak=0;wrong++;score=Math.max(0,score-5);fb.textContent='Answer was '+cur.ans;api.pop('-5','bad');api.flash('bad')}
    api.setScore(score);api.combo(streak);next();
  }
  $('#opts').addEventListener('click',function(e){var b=e.target.closest('.opt');if(b)choose(+b.dataset.v)});
  onKey(function(e){var n=parseInt(e.key,10);if(cur&&n>=1&&n<=4&&cur.opts[n-1]!==undefined)choose(cur.opts[n-1])});
  function end(){if(over)return;over=true;var t=solved+wrong;done({score:score,combo:bestStreak,xp:Math.round(score/5),facts:[['Solved',solved],['Accuracy',(t?Math.round(solved/t*100):0)+'%'],['Best combo',bestStreak]]})}

/* ---------- Back Track (n-back) ---------- */
RUNNERS.back=function(api,done){
  var N=30,STEP=2000,trial=0,seq=[],hits=0,missed=0,fa=0,score=0,responded=false,isMatch=false,over=false,nback=1;
  api.setTime('0/'+N,1,'TRIAL');
  api.stage.innerHTML='<p class="fb mono" id="bmsg"></p><div class="board still" id="board"></div>'+
    '<button class="btn primary bigbtn" id="match">Match</button><p class="fb mono">Space also works. Tap only when the lit tile repeats.</p>';
  var board=$('#board'),msg=$('#bmsg'),h='';
  for(var i=0;i<9;i++)h+='<div class="tile"></div>';
  board.innerHTML=h;
  function respond(){
    if(over||trial>=N||responded||seq.length===0)return;
    responded=true;
    if(isMatch){hits++;score+=10;api.setScore(score);api.pop('+10','ok');api.flash('ok')}
    else{fa++;score=Math.max(0,score-5);api.setScore(score);api.pop('-5','bad');api.flash('bad')}
  }
  function run(){
    if(over)return;
    if(trial>=N){end();return}
    var was=nback;nback=trial<14?1:2;
    var prev=seq[trial-nback],cell;
    if(trial>=nback&&Math.random()<.32){cell=prev}else{do{cell=r(0,8)}while(trial>=nback&&cell===prev)}
    isMatch=trial>=nback&&cell===prev;responded=false;seq.push(cell);
    msg.textContent=(nback===2&&was===1?'Now two steps back. ':'')+nback+'-back: same tile as '+nback+' step'+(nback>1?'s':'')+' ago?';
    api.setTime((trial+1)+'/'+N,1-trial/N,'TRIAL');
    board.children[cell].classList.add('lit');
    later(function(){board.children[cell].classList.remove('lit')},1300);
    later(function(){
      if(isMatch&&!responded){missed++;board.children[cell].classList.add('miss');later(function(){board.children[cell].classList.remove('miss')},300)}
      trial++;run();
    },STEP);
  }
  tapBtn($('#match'),respond);
  function end(){if(over)return;over=true;done({score:score,combo:0,xp:Math.round(score/3),facts:[['Hits',hits],['Missed',missed],['False taps',fa]]})}
  run();
};

/* ---------- shared bits for the newer games ---------- */
function tone(f){
  if(S.mute)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);

/* ---------- Mini Sudoku ---------- */
function makeSudoku(){
  var g=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],perm=shuffle([1,2,3,4]);
  g=g.map(function(row){return row.map(function(v){return perm[v-1]})});
  function ops(m){
    var t;
    if(Math.random()<.5){t=m[0];m[0]=m[1];m[1]=t}
    if(Math.random()<.5){t=m[2];m[2]=m[3];m[3]=t}
    if(Math.random()<.5)m=[m[2],m[3],m[0],m[1]];
    return m;
  }
  g=ops(g);
  g=g[0].map(function(_,c){return g.map(function(row){return row[c]})});
  return ops(g);
}
